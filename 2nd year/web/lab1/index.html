<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная работа №1 — Проверка точки в области</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    
    <header class="header">
      <div class="header__line">ФИО: Эвида Хана Ваел Ибрахим Халил </div>
      <div class="header__line">Группа: P3215</div>
      <div class="header__line">Вариант: 12733 </div>
    </header>

   
    <section class="canvas-section">
      <canvas id="plane" width="420" height="420"></canvas>
    </section>

   
    <section class="form-section">
      <form id="pointForm" novalidate>

        <div class="field">
          <span class="field__label">X:</span>
          <div class="btn-group" id="xButtonGroup">
            <button type="button" class="x-btn" data-value="-4">-4</button>
            <button type="button" class="x-btn" data-value="-3">-3</button>
            <button type="button" class="x-btn" data-value="-2">-2</button>
            <button type="button" class="x-btn" data-value="-1">-1</button>
            <button type="button" class="x-btn" data-value="0">0</button>
            <button type="button" class="x-btn" data-value="1">1</button>
            <button type="button" class="x-btn" data-value="2">2</button>
            <button type="button" class="x-btn" data-value="3">3</button>
            <button type="button" class="x-btn" data-value="4">4</button>
          </div>
          <div class="error" id="xError"></div>
        </div>

        <div class="field">
          <label class="field__label" for="yInput">Y (от -3 до 3):</label>
          <input type="text" id="yInput" name="y" inputmode="decimal" autocomplete="off">
          <div class="error" id="yError"></div>
        </div>

        <div class="field">
          <label class="field__label" for="rSelect">R:</label>
          <select id="rSelect" name="r">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
          <div class="error" id="rError"></div>
        </div>

        <div class="field field--submit">
          <button type="submit" id="submitBtn">Проверить точку</button>
        </div>

      </form>
    </section>

    
    <section class="results-section">
      <h2 class="results-title">Результаты проверок</h2>
      <table class="results-table" id="resultsTable">
        <thead>
          <tr>
            <th>X</th>
            <th>Y</th>
            <th>R</th>
            <th>Результат</th>
            <th>Дата и время</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
        
        </tbody>
      </table>
      <p class="empty-state" id="emptyState">Пока нет ни одной проверки.</p>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
